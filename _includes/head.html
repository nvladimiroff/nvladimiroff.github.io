<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <meta name="theme-color" content="#8093F1">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }}
    {% else %}
      {{ site.title }} &dash; {{ page.title }}
    {% endif %}
  </title>

  {% if page.url and site.baseurl %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% endif %}

  <link rel="stylesheet" href="{{ '/public/css/reset.css' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/public/css/cake.css' | absolute_url }}">
  <link rel="preload" href= "{{ '/public/css/code.css' | absolute_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="{{ '/public/fonts/Pacifico-Regular.woff2' | absolute_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/public/fonts/Nunito-VariableFont_wght.woff2' | absolute_url }}" as="font" type="font/woff2" crossorigin>
  <noscript><link rel="stylesheet" href="{{ '/public/css/code.css' | absolute_url }}""></noscript>

  <!-- <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ '/public/apple-touch-icon-precomposed.png' | absolute_url }}"> -->
  <link rel="shortcut icon" href="{{ '/public/favicon.ico' | absolute_url }}">
  <style>
    @font-face {
      font-family: 'Pacifico';
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url({{ '/public/fonts/Pacifico-Regular.woff2' | absolute_url }}) format('woff2');
      unicode-range: U+0000-00FF;
    }
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 200 1000;
      font-display: block;
      src: url({{ '/public/fonts/Nunito-VariableFont_wght.woff2' | absolute_url }}) format('woff2');
      unicode-range: U+0000-00FF;
  }
  </style>
</head>
